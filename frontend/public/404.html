<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>K-Tour AI</title>
    <script type="text/javascript">
      // Redirects a deep-link 404 (e.g. /search) back to index.html, encoding
      // the intended path in the query string so main.jsx can restore it.
      // Standard technique for SPAs on GitHub Pages: https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1; // keep '/k-tour-ai-frontend'
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
