services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ktour_pgvector
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ktour_pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  ktour_pgdata:
